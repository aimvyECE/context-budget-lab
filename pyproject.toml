[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "context-budget-lab"
version = "0.1.0"
description = "Portable lexical retrieval with word budgets, provenance and stale-source verification"
requires-python = ">=3.10"
license = {text = "MIT"}
[tool.setuptools.packages.find]
include = ["context_budget*"]
